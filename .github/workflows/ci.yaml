name: CI-Pipeline

on:
  push:
    branches:
      - dev 
env:
  IMAGE_NAME: intranet-newdeal
  IMAGE_TAG: latest
  DOCKER_REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:

  # ===============================
  # JOB 1 - Build image Docker (nginx:alpine3.23) 
  # ===============================
  builds:
    runs-on: runner_prod

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Display variables
        run: |
          echo "IMAGE_NAME: $IMAGE_NAME"
          echo "IMAGE_TAG: $IMAGE_TAG"
          echo "DOCKER_REGISTRY: $DOCKER_REGISTRY"

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
          docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build -t ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      # - name: Verify image
      #   run: |
      #     docker image ls | grep ${{ env.IMAGE_NAME }}

      # - name: Push Docker image
      #   run: |
      #     docker push ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  # ===============================
  # JOB 2 - Scan sécurité (vulnérabilités + secrets) 
  # ===============================
  scans:
    needs: builds
    runs-on: ubuntu-latest
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          vuln-type: os,library
          ignore-unfixed: true

      # Scanner le code source avec Gitleaks
      - name: Run Gitleaks on source code
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --no-banner --redact
    # steps:
    #   - name: Pull latest image
    #     run: |
    #       echo "Hello deploy"

    #   - name: Pull latest image
    #     run: |
    #       docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

    #   - name: Stop existing container
    #     run: |
    #       docker stop ci-app || true

    #   - name: Remove old container
    #     run: |
    #       docker rm ci-app || true

    #   - name: Run new container
    #     run: |
    #       docker run -d \
    #         -p 80:80 \
    #         --name ci-app \
    #         ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

    publish:
      needs: scans
      runs-on: ubuntu-latest
      steps:
        - name: Verify image
          run: |
            docker image ls | grep $IMAGE_NAME
        - name: Push Docker image
          run: |
            docker push $DOCKER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG
        

